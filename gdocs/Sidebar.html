<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap');
:root{--bg:#fff;--card:#f4f4f4;--ink:#000;--mute:#6b6b6b;--line:#ddd;--chip:#e6e6e6;--mint:#8be4b2;--mint-ink:#294635;--cyan:#07c1ff;--cyan-ink:#000;--field:#fff;--ease:cubic-bezier(.23,1,.32,1);--r:10px;--rl:16px}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1c;--ink:#f2f2f2;--mute:#9a9a9a;--line:#333;--chip:#2a2a2a;--field:#111}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,-apple-system,"Segoe UI",sans-serif}
.m{background:var(--mint);color:#000;padding:0 .2em;border-radius:var(--r)}
.c{background:var(--cyan);color:#000;padding:0 .2em;border-radius:var(--r)}
.wp{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:24px;max-width:650px;margin:0 auto}
.wp label{display:block;margin:20px 0 8px}.wp>label:first-child,.wp>.seg:first-child+label{margin-top:20px}
.wp textarea{width:100%;min-height:72px;font:inherit;font-size:1.25rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:12px;resize:vertical}
.wp textarea:focus{outline:2px solid var(--mint);outline-offset:0;border-color:var(--mint)}
.wp small{display:block;color:var(--mute);margin-top:6px;font-size:.85rem}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.seg button{font:inherit;color:var(--ink);background:var(--chip);border:0;border-radius:var(--r);padding:10px 14px;cursor:pointer;transition:background .12s var(--ease),transform .1s var(--ease)}
@media (hover:hover){.seg button:hover{filter:brightness(.96)}}
.seg button:active{transform:scale(.97)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg button[aria-pressed=true]{background:var(--mint);color:var(--mint-ink)}
.wp .seg button small{display:inline;margin:0;color:inherit;font-size:inherit;opacity:.8}
.res{margin-top:28px}.res span{display:block}.res b{display:block;font-size:2rem;font-weight:500;line-height:1.2}
.res .d{color:var(--mute);font-size:.85rem}
.src{margin-bottom:4px}.src button[aria-pressed]{}
.wp.mini{border:0;padding:16px;max-width:none;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
.wp.mini .seg button{padding:8px 10px;font-size:.9rem}.wp.mini textarea{font-size:1rem}.wp.mini .res b{font-size:1.75rem}
.ic{width:1em;height:1em;vertical-align:-.125em;margin-right:.45em}.res span .ic{color:var(--mute)}h2 .ic{color:var(--mute)}

.wp .hd{display:flex;align-items:center;gap:8px;font-weight:600;font-size:1.05rem}.wp .logo{width:24px;height:24px}
.wp .hero{font-size:1.4rem;font-weight:700;line-height:1.3;margin:10px 0 16px}
.wp input{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.wp input:focus{outline:2px solid var(--mint);border-color:var(--mint)}
</style></head><body><div id="app"></div>

function icon(n){var i=IC[n];return'<svg class="ic" viewBox="'+i[0]+'" aria-hidden="true" fill="currentColor"><path d="'+i[1]+'"/></svg>'}
var MODE_IC={aloud:'volume-high',read:'book-open'};
var LEVELS=['Slow','Average','Fast'];
function count(t){t=String(t||'').trim();if(/^[\d,.\s]+$/.test(t)&&/\d/.test(t))return Math.round(parseFloat(t.replace(/[,\s]/g,''))||0);return(t.match(/\S+/g)||[]).length}
function fmt(words,wpm){var s=Math.ceil(words/wpm*60-1e-9);if(s<1)return words?'under 1 sec':'0 sec';
 var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60,o=[];
 if(h)o.push(h+' hr');if(m)o.push(m+' min');if(r&&!h)o.push(r+' sec');return o.join(' ')}
var LOGO='<svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#8be4b2"/><g fill="none" stroke="#294635" stroke-width="9" stroke-linecap="round"><path d="M30 40h40M30 64h28M30 88h40"/><circle cx="88" cy="78" r="20"/><path d="M88 66v12l8 6"/></g></svg>';
function mount(el,opt){opt=opt||{};var st={mode:'aloud',lvl:1,words:0,cw:0};
 el.classList.add('wp');if(opt.mini)el.classList.add('mini');
 el.innerHTML=(opt.mini?'<div class="hd">'+LOGO+'wordtick</div><p class="hero">turn <span class="m">words</span> into <span class="c">time</span>.</p>':'')+(opt.source?'<div class="seg src"><button data-s="sel">Use selection</button><button data-s="all">Use whole document</button></div>':'')+
 '<div class="seg" id="wp-m"></div>'+
 '<label for="wp-t">Word Count</label><textarea id="wp-t" rows="2"></textarea><small>...or paste in your text for auto-counting</small>'+
 '<label>Reading Speed</label><div class="seg" id="wp-l"></div>'+
 (opt.mini?'<label for="wp-c">Custom speed (wpm)</label><input id="wp-c" type="number" min="1" inputmode="numeric" placeholder="e.g. 180">':'')+
 '<div class="res" aria-live="polite"><span>'+icon('clock')+'Result</span><b id="wp-r">0 sec</b><span class="d" id="wp-n"></span></div>';
 var $=function(i){return el.querySelector('#'+i)},t=$('wp-t');
 function wpm(){return st.cw||MODES.find(function(m){return m.id===st.mode}).s[st.lvl]}
 function draw(){
  $('wp-m').innerHTML=MODES.map(function(m){return'<button data-m="'+m.id+'" aria-pressed="'+(m.id===st.mode)+'">'+icon(MODE_IC[m.id])+m.name+'</button>'}).join('');
